<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <title>Emoji Picker Example</title>
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css" />
    <style>
      body {
        padding-top: max(env(safe-area-inset-top), 1rem);
        padding-left: max(env(safe-area-inset-left), 1rem);
        padding-right: max(env(safe-area-inset-right), 1rem);
        padding-bottom: max(env(safe-area-inset-bottom), 1rem);
      }
    </style>
    <script defer type="module" src="./js/script.js"></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Emoji Picker Test</h1>
        <p>Use this screen to validate the plugin behavior on web, Android, and iOS.</p>
      </header>

      <section>
        <h2>Presentation</h2>
        <button id="present-auto" type="button">Present emoji picker (auto)</button>
        <button id="present-web" type="button">Present emoji picker (web)</button>
      </section>

      <section>
        <h2>Close button (iOS only)</h2>
        <label for="close-button-size">Size</label>
        <select id="close-button-size">
          <option value="xSmall">xSmall (24)</option>
          <option value="small">Small (32)</option>
          <option value="medium" selected>Medium (48)</option>
          <option value="large">Large (64)</option>
        </select>

        <label for="close-button-position">Position</label>
        <select id="close-button-position">
          <option value="left">Left</option>
          <option value="center">Center</option>
          <option value="right" selected>Right</option>
        </select>

        <label><input id="close-button-hidden" type="checkbox" /> Hide close button</label>
        <label><input id="dismiss-on-backdrop-tap" type="checkbox" checked /> Dismiss on backdrop tap</label>
      </section>

      <section>
        <h2>Theme</h2>
        <label for="theme">Appearance</label>
        <select id="theme">
          <option value="system" selected>System</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </section>

      <section>
        <h2>Result</h2>
        <p>Selected emoji: <strong id="selected-emoji">—</strong></p>
        <p>Last error: <strong id="error-output">None</strong></p>
      </section>
    </main>
  </body>
</html>
